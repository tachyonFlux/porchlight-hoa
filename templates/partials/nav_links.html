{% with p=request.path %}
<a href="{% url 'core:dashboard' %}" {% if p == '/' %}class="active"{% endif %}>Home</a>
<a href="{% url 'community:directory' %}" {% if p == '/homes/' %}class="active"{% endif %}>Neighbors</a>
{% if is_board %}
  {% if mobile %}<span class="nav-label">Board</span>{% endif %}
  <a href="{% url 'community:board_homes' %}" {% if '/board/homes' in p %}class="active"{% endif %}>Homes</a>
  <a href="{% url 'community:people' %}" {% if '/board/people' in p %}class="active"{% endif %}>People</a>
  <a href="{% url 'accounts:board_list' %}" {% if '/board/members' in p %}class="active"{% endif %}>Board</a>
  {% if is_admin %}<a href="{% url 'core:settings' %}" {% if '/board/settings' in p %}class="active"{% endif %}>Settings</a>{% endif %}
{% endif %}
<a href="{% url 'accounts:account' %}" {% if '/account' in p %}class="active"{% endif %}>Account</a>
<form method="post" action="{% url 'accounts:logout' %}" class="inline-form">{% csrf_token %}<button class="linkish nav-signout" style="padding:.4rem .65rem;text-decoration:none;color:var(--muted)">Sign out</button></form>
{% endwith %}
