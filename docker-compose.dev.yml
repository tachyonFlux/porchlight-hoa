# Build Porchlight from this source tree instead of pulling the published image:
#   docker compose -f docker-compose.dev.yml up --build
# Uses the same .env file. For day-to-day development without Docker, see the README.

x-porchlight: &porchlight
  image: porchlight:dev
  env_file: .env
  environment:
    PORCHLIGHT_DATA_DIR: /data
  volumes:
    - ./data:/data

services:
  web:
    <<: *porchlight
    build: .
    command: web
    ports:
      # Only this computer can reach the port; the reverse proxy forwards to it. See
      # PORCHLIGHT_BIND in .env.example to open it to your network.
      - "${PORCHLIGHT_BIND:-127.0.0.1}:${PORCHLIGHT_PORT:-8000}:8000"

  scheduler:
    <<: *porchlight
    pull_policy: never  # uses the image the web service builds
    command: scheduler

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: porchlight
      POSTGRES_USER: porchlight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # required when using the postgres profile
    volumes:
      - ./postgres:/var/lib/postgresql/data
