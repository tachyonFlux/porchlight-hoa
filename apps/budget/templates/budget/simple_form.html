{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card"><h1>{{ title }}</h1>
  {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
  <form method="post">{% csrf_token %}{% include "partials/form.html" %}
    <div class="actions"><button class="primary" type="submit">Save</button><a class="btn" href="{{ back }}">Cancel</a>
      {% if deletable %}<button class="danger" type="submit" name="delete" value="1" formnovalidate onclick="return confirm('Delete this?')">Delete</button>{% endif %}</div></form></div>
{% endblock %}
