{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{% if user.has_usable_password %}Change password{% else %}Set a password{% endif %}</h1>
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="primary" type="submit">Save password</button>
  </form>
</div>
{% endblock %}
