{% extends "base.html" %}
{% block title %}Board sign in{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in with password</h1>
  {% if error %}<ul class="errorlist"><li>{{ error }}</li></ul>{% endif %}
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="primary block" type="submit">Sign in</button>
  </form>
</div>
<p class="muted" style="text-align:center;margin-top:1rem"><a href="{% url 'accounts:login' %}">Email me a link instead</a></p>
{% endblock %}
