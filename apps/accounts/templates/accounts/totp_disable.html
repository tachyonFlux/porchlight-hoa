{% extends "base.html" %}
{% block title %}Turn off two-step{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Turn off two-step sign in</h1>
  <p>Enter a current code from your authenticator app to confirm.</p>
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="danger" type="submit">Turn off</button>
  </form>
</div>
{% endblock %}
