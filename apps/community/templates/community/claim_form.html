{% extends "base.html" %}
{% block title %}Join your neighborhood{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ home.address }}</h1>
  <p>Tell us who you are. We'll email you a link to confirm.</p>
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="primary block" type="submit">Send confirmation email</button>
  </form>
</div>
{% endblock %}
