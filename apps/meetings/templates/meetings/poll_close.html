{% extends "base.html" %}
{% block title %}Pick the date{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Pick the date</h1>
  <p class="muted">{{ poll.title }}. The most popular time is selected; choose another if you like.</p>
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="primary block" type="submit">Close poll and schedule meeting</button>
  </form>
</div>
{% endblock %}
