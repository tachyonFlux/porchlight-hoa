name: Release

# Push a tag like v1.2.3 to publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
# The image goes to Docker Hub (and GitHub Container Registry) as 1.2.3, 1.2 and latest.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    env:
      DOCKERHUB_IMAGE: tachyonflux/porchlight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Image names must be lowercase.
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=ghcr.io/$owner/porchlight" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Porchlight
            org.opencontainers.image.description=Self-hosted management for self-managed HOAs
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PORCHLIGHT_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release notes from the commits since the last release
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install or upgrade"
            echo
            echo "Image: \`${DOCKERHUB_IMAGE}:${VERSION}\` (also \`${GHCR_IMAGE}:${VERSION}\`)."
            echo "Make a backup first, then follow the upgrade steps in the README."
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..${GITHUB_REF_NAME}"
            else
              echo "- First release."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Porchlight $VERSION" --notes-file release-notes.md --verify-tag
