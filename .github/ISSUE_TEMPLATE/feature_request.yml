name: Feature idea
description: Suggest something that would help run your association.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not just the feature. Who does it (board, treasurer, residents) and how often?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A spreadsheet, email, paper? This helps judge how it should fit in.
